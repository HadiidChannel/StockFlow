      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: &id012
                        type: string
                        format: uuid
                        example: 3f0b8e20-05aa-4c3c-a3a0-6bf2b7d4c1aa
                      status:
                        type: string
                        enum:
                        - INACTIVE
                    additionalProperties: false
                    required:
                    - id
                    - status
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      parameters:
