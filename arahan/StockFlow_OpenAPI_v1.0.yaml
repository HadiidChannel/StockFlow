                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                additionalProperties: false
                required:
                - data
                - meta
        '400': *id001
        '401': *id002
        '403': *id003
        '500': *id008
        '503': *id009
      parameters:
      - &id013
        $ref: '#/components/parameters/Page'
      - &id014
        $ref: '#/components/parameters/PageSize'
      - &id015
        $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/RequestId'
      security: *id011
      x-required-permission: user.manage
      x-allowed-roles: ADMIN
      x-data-scope: ORGANIZATION
    post:
      summary: Membuat pengguna
      operationId: createUser
      tags:
      - Users
      responses:
        '201':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      security: *id010
      description: Pembuatan user dan assignment awal untuk WAREHOUSE_STAFF harus atomik.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      x-required-permission: user.manage
      x-allowed-roles: ADMIN
      x-data-scope: ORGANIZATION
  /users/{id}:
    get:
      summary: Detail pengguna
      operationId: getUser
      tags:
      - Users
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      parameters:
      - name: id
        in: path
        required: true
        description: UUID resource.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      security: *id011
      x-required-permission: user.manage
      x-allowed-roles: ADMIN
      x-data-scope: ORGANIZATION
    patch:
      summary: Mengubah data atau role pengguna
      operationId: updateUser
      tags:
      - Users
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      parameters:
      - name: id
        in: path
        required: true
        description: UUID resource.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      security: *id010
      description: Perubahan role menjadi WAREHOUSE_STAFF dan assignment minimal satu gudang aktif harus atomik.
      x-required-permission: user.manage
      x-allowed-roles: ADMIN
      x-data-scope: ORGANIZATION
  /users/{id}/deactivate:
    post:
      summary: Menonaktifkan pengguna
      operationId: deactivateUser
      tags:
