              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WarehouseAssignment'
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      parameters:
      - name: id
