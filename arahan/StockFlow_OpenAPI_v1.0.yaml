        type: string
        maxLength: 128
        minLength: 1
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token dari cookie sf_csrf.
      schema:
        type: string
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: ID korelasi opsional dari client. Server harus membuat request ID jika tidak diberikan.
      schema:
        type: string
        maxLength: 128
  responses:
    BadRequest:
      description: Input tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Session tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission, warehouse scope, atau CSRF ditolak.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Konflik data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessRuleViolation:
      description: Business rule tidak terpenuhi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Kesalahan internal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
