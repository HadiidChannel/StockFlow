openapi: 3.1.0
info:
  title: StockFlow API
  version: 1.0.0
  description: 'Kontrak REST API StockFlow MVP. Sumber normatif: PRD StockFlow v1.0.1, FSD StockFlow v1.0.1, ERD
    & Database Specification StockFlow v1.0, dan MySQL Schema v1.0. Base path server sudah /api/v1. Semua field
    quantity dan monetary dikirim sebagai string decimal untuk menjaga presisi.'
servers:
- url: /api/v1
  description: API version 1
tags:
- name: Authentication
  description: Session authentication, user context, dan perubahan password.
- name: Users
  description: User management dan warehouse assignment.
- name: Organization
  description: Profil organisasi instalasi.
- name: Categories
  description: Master kategori.
- name: Products
  description: Master produk dan histori movement produk.
- name: Warehouses
  description: Master gudang.
- name: Inventory
  description: Saldo per produk dan gudang.
- name: Stock Transactions
  description: Stock In, Stock Out, dan full reversal.
- name: Movements
  description: Riwayat pergerakan stok.
- name: Dashboard
  description: KPI dan aktivitas dashboard.
- name: Preferences
  description: Preferensi pribadi user.
security:
- sessionCookie: []
paths:
  /auth/login:
    post:
      summary: Login dan membuat session
      operationId: login
      tags:
      - Authentication
      responses:
        '200':
          description: Login berhasil. Server mengatur cookie sf_session (HttpOnly) dan sf_csrf (readable oleh frontend).
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Minimal menetapkan cookie sf_session dan sf_csrf.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponseData'
                additionalProperties: false
                required:
                - data
        '400':
          description: Terjadi kesalahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Kredensial tidak valid; pesan harus umum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Terjadi kesalahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Terjadi kesalahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      description: Memvalidasi Origin, Content-Type, dan rate limit. CSRF header dikecualikan untuk login. Password
        tidak pernah dikembalikan.
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/logout:
    post:
      summary: Logout dan mencabut session
      operationId: logout
      tags:
      - Authentication
      responses:
        '204':
          description: Session dicabut; cookie session dan CSRF dihapus.
        '401':
          description: Terjadi kesalahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Terjadi kesalahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: &id010
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      x-required-permission: authenticated
      x-allowed-roles: ALL_AUTHENTICATED
      x-data-scope: N/A
  /auth/me:
    get:
      summary: Mendapatkan user aktif, role, dan permission
      operationId: getCurrentUser
      tags:
      - Authentication
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthUser'
                additionalProperties: false
                required:
                - data
        '400': &id001
          description: Input atau query tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': &id002
          description: Session tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403': &id003
          description: Permission atau CSRF ditolak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404': &id004
          description: Resource tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409': &id005
          description: Konflik data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': &id006
          description: Business rule tidak terpenuhi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': &id007
          description: Rate limit terlampaui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500': &id008
          description: Kesalahan internal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503': &id009
          description: Service tidak tersedia sementara.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: &id011
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      x-required-permission: authenticated
      x-allowed-roles: ALL_AUTHENTICATED
      x-data-scope: N/A
  /auth/change-password:
    post:
      summary: Mengubah password sendiri
      operationId: changePassword
      tags:
      - Authentication
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthUser'
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      security: *id010
      parameters:
      - $ref: '#/components/parameters/RequestId'
      x-required-permission: authenticated
      x-allowed-roles: ALL_AUTHENTICATED
      x-data-scope: N/A
  /users:
