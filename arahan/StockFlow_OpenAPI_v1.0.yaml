          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId: *id012
                      mustChangePassword:
                        type: boolean
                      temporaryPassword:
                        type: string
                        format: password
                        description: Ditampilkan satu kali setelah reset; jangan dicatat ke log atau disimpan di
                          UI.
                    additionalProperties: false
                    required:
                    - userId
                    - mustChangePassword
                    - temporaryPassword
                additionalProperties: false
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      parameters:
      - name: id
        in: path
        required: true
        description: UUID resource.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      security: *id010
      description: Endpoint Should Have pada FSD. Rincian mekanisme password sementara perlu dikunci sebelum implementasi.
      x-required-permission: user.manage
      x-allowed-roles: ADMIN
      x-data-scope: ORGANIZATION
  /users/{id}/warehouses:
