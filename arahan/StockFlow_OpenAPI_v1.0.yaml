        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      parameters:
      - name: id
        in: path
        required: true
        description: UUID resource.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      security: *id011
