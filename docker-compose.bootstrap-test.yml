name: ${COMPOSE_PROJECT_NAME:-stockflow-bootstrap-test}

services:
  db:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
      MYSQL_DATABASE: ${BOOTSTRAP_DB_NAME:?BOOTSTRAP_DB_NAME wajib diisi}
      MYSQL_USER: ${DB_USER:-stockflow_test_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    ports:
      - "127.0.0.1:${BOOTSTRAP_TEST_PORT:-3307}:3306"
    volumes:
      - mysql_bootstrap_test_data:/var/lib/mysql
    networks:
      - stockflow_bootstrap_test_net
    labels:
      com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
      com.docker.compose.service: db
      stockflow.test.run_id: ${RUN_ID}
      stockflow.test.purpose: bootstrap-integration
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25

  migrator:
    build:
      context: ./backend
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: mysql://${DB_USER:-stockflow_test_user}:${DB_PASSWORD:?DB_PASSWORD wajib diisi}@db:3306/${BOOTSTRAP_DB_NAME:?BOOTSTRAP_DB_NAME wajib diisi}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockflow_bootstrap_test_net
    labels:
      com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
      com.docker.compose.service: migrator
      stockflow.test.run_id: ${RUN_ID}

volumes:
  mysql_bootstrap_test_data:
    labels:
      com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
      stockflow.test.run_id: ${RUN_ID}

networks:
  stockflow_bootstrap_test_net:
    labels:
      com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
      stockflow.test.run_id: ${RUN_ID}
